// 从对话文本提取目的地（支持省级自驾识别）
function extractDestination(text) {
  if (!text) return null;

  // 1. 先检测省级自驾意图（优先级最高）
  if (window.PROVINCE_DRIVING) {
    for (const [prov, aliases] of Object.entries(window.PROVINCE_ALIASES || {})) {
      const pattern = new RegExp(aliases.join('|'));
      if (pattern.test(text) && (text.match(/自驾|环线|环游|全省|跨城|多城|省内|周游|穿越|环\S{1,3}游|游遍|走遍|转一圈/) || text.match(/几个城市|多个.*城市|串.*城市/))) {
        return { type: 'province', province: prov };
      }
    }
  }

  // 2. 普通城市匹配
  const city = extractCity(text);
  if (city) return { type: 'city', city };
  return null;
}

function extractCity(text) {
  if (!text) return null;
  const cities = Object.keys(window.CITY_DATABASE);
  for (const c of cities) {
    if (text.includes(c)) return c;
  }
  // 模糊匹配（含别称/省份关键词）

  if (text.match(/魔都|沪|上海|申城/)) return '上海';
  if (text.match(/蓉|成都|天府|川A|四川/)) return '成都';
  if (text.match(/杭州|杭城|临安|西湖|钱塘/)) return '杭州';
  if (text.match(/西安|长安|古都|陕西/)) return '西安';
  // 新增 7 城市

  if (text.match(/广州|羊城|花城|穗|岭南|广东|珠三角/)) return '广州';
  if (text.match(/南京|金陵|建康|秣陵|江宁|石头城/)) return '南京';
  if (text.match(/苏州|姑苏|吴中|平江|拙政|江南水乡|江苏/)) return '苏州';
  if (text.match(/青岛|崂山|泰山|曲阜|济南|山东|齐鲁|蓬莱/)) return '青岛';
  if (text.match(/厦门|鹭岛|鼓浪屿|土楼|武夷|泉州|福建|闽/)) return '厦门';
  if (text.match(/昆明|春城|大理|丽江|香格里拉|云南|滇|彩云之南|玉龙雪山|洱海/)) return '昆明';
  // 新增 3 城市

  if (text.match(/长沙|星城|湘|橘子洲|岳麓|湖南|臭豆腐|茶颜悦色/)) return '长沙';

  // 山西省新增9城市

  // 浙江省新增9城市

  if (text.match(/江郎山|廿八都|龙游石窟|根宫佛国|仙霞关|衢州/)) return '衢州';
  if (text.match(/天台山|国清寺|神仙居|括苍山|临海古城|台州/)) return '台州';

  // 新疆 10城

  if (text.match(/赛里木湖|薰衣草|喀赞其|伊犁|伊宁/)) return '伊宁';

  if (text.match(/魔鬼城|乌尔禾|黑油山|克拉玛依/)) return '克拉玛依';

  if (text.match(/喀纳斯|禾木|可可托海|五彩滩|阿勒泰/)) return '阿勒泰';
  if (text.match(/怪石沟|博尔塔拉|艾比湖|博乐/)) return '博乐';
  if (text.match(/火焰山|葡萄沟|坎儿井|交河故城|吐鲁番/)) return '吐鲁番';
  if (text.match(/那拉提草原|空中草原|巩乃斯|那拉提/)) return '那拉提';
  if (text.match(/军垦博物馆|北湖公园|军垦第一连|石河子/)) return '石河子';
  // 省级回退（不带自驾关键词时，匹配为省会城市）
  if (text.match(/贵州|黔|贵阳|甲秀楼|青岩|黔灵山/)) return null; // 让省级自驾优先捕获
  if (text.match(/新疆|疆|乌鲁木齐|大美新疆/)) return null; // 让省级自驾优先捕获
  return null;
}

// 从文本中提取出发地
function extractStartingPoint(text) {
  if (!text) return null;
  const patterns = [
    /从(.+?)(?:出发|去|到)/,
    /(.+?)出发(?:去|到)/,
    /在(.+?)(?:出发|去)/,
    /^从(.+?)去/,
  ];
  for (const p of patterns) {
    const m = text.match(p);
    if (m) {
      const cleaned = m[1].replace(/我|想|打算|计划|准备/g, '').trim();
      if (cleaned) {
        const city = extractCity(cleaned);
        return city || cleaned;
      }
    }
  }
  return null;
}

// 计算路线总耗时和距离（粗略估算）
function calcRouteCost(prefs, route, city) {
  const { budget, companions, transport, preference } = prefs;
  const days = route.days;
  const trans = window.CITY_DATABASE[city].transport;

  // 票价合计
  let ticketCost = 0;
  const allSpots = [
    ...window.CITY_DATABASE[city].attractions.mustSee,
    ...window.CITY_DATABASE[city].attractions.secondary,
    ...window.CITY_DATABASE[city].attractions.hidden
  ];
  route.spots.forEach(name => {
    const sp = allSpots.find(s => s.name === name || name.includes(s.name));
    if (sp) ticketCost += sp.ticket || 0;
  });

  // 出行成本
  const transportDaily = transport === 'rentcar' ? (350 + trans.driving.tollPerDay + trans.driving.fuelPer100km*1.5 + trans.driving.parking)
                        : transport === 'owncar' ? (trans.driving.tollPerDay + trans.driving.fuelPer100km*1.5 + trans.driving.parking)
                        : trans.publicTransit.metroDailyCost + trans.publicTransit.taxiAvg*2;
  const transportTotal = transportDaily * days;

  // 餐饮（按人数和年龄结构调整）
  const mealMultiplier = companions === 'both' ? 1.4 : (companions === 'kids' || companions === 'elder' ? 1.2 : 1);
  const mealDaily = 200 * mealMultiplier;
  const mealTotal = mealDaily * days;

  // 住宿（按预算自动定档）
  const hotelTier = budget < 3000 ? 'budget' : budget < 6000 ? 'mid' : 'luxury';
  const hotelData = window.CITY_DATABASE[city].accommodation[hotelTier][0];
  const hotelTotal = hotelData.price * (days - 1);

  // 往返机票（按城市距离粗估）
  const flightCost = 1200;

  // 购物预算
  const shopping = Math.max(500, budget * 0.1);

  return {
    flight: flightCost,
    hotel: hotelTotal,
    food: mealTotal,
    transport: transportTotal,
    ticket: ticketCost,
    shopping,
    // 购物预留仅作提示，不计入总费用
    total: flightCost + hotelTotal + mealTotal + transportTotal + ticketCost,
    hotelTier,
    hotelDaily: hotelData.price,
    days
  };
}

/* ============ 信息收集 ============ */
function NumberInput({ cur, next }) {
  const [val, setVal] = useState('');
  // 限制最大值防止自动化场景下的累加输入异常（最大 1000 万）
  const MAX = 10000000;
  const sanitize = (raw) => {
    // 仅保留数字
    const digits = String(raw).replace(/[^\d]/g, '');
    if (!digits) return '';
    let n = parseInt(digits, 10);
    if (Number.isNaN(n)) return '';
    if (n > MAX) n = MAX;
    return String(n);
  };
  const submit = () => { if (val) next(Number(val)); };
  return (
    <div className="flex items-center gap-3">
      <input type="number" placeholder={cur.placeholder} autoFocus
        value={val}
        min={cur.min || 0}
        max={cur.max || MAX}
        inputMode="numeric"
        onChange={e => setVal(sanitize(e.target.value))}
        onBlur={e => setVal(sanitize(e.target.value))}
        onKeyDown={e => e.key === 'Enter' && submit()}
        className="flex-1 px-4 py-3 border-2 border-slate-200 rounded-xl text-lg focus:border-sky-500 outline-none" />
      <span className="text-slate-500">{cur.suffix}</span>
      <button onClick={submit} disabled={!val}
        className="px-6 py-3 bg-sky-500 text-white rounded-xl font-semibold hover:bg-sky-600 disabled:opacity-30">
        下一步 →
      </button>
    </div>
  );
}

function InfoCollector({ city, prompt, startPoint, onComplete }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [showCityPicker, setShowCityPicker] = useState(!city);
  const [pickedCity, setPickedCity] = useState(city);

  const Q = window.PREFERENCE_QUESTIONS;
  const cur = Q[step];

  if (showCityPicker) {
    return (
      <div className="max-w-3xl mx-auto py-12 px-6">
        <div className="bg-white rounded-2xl p-8 glow-card">
          <div className="text-sm text-sky-600 mb-2">⏰ 第一期支持城市</div>
          <h2 className="text-2xl font-bold mb-2">没识别出明确目的地，请选择想去的城市</h2>
          <p className="text-slate-500 mb-6">你的输入：「{prompt}」</p>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            {Object.keys(window.CITY_DATABASE).map(c => (
              <button key={c} onClick={() => { setPickedCity(c); setShowCityPicker(false); }}
                className="p-4 rounded-xl border-2 border-slate-200 hover:border-sky-500 hover:bg-sky-50 transition text-left">
                <div className="font-bold text-lg">{c}</div>
                <div className="text-xs text-slate-500">{window.CITY_DATABASE[c].bestSeason}</div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  const next = (val) => {
    const newAns = { ...answers, [cur.id]: val };
    setAnswers(newAns);
    if (step + 1 < Q.length) {
      setStep(step + 1);
    } else {
      onComplete(pickedCity, newAns);
    }
  };

  return (
    <div className="max-w-3xl mx-auto py-12 px-6">
      {/* 进度 */}
      <div className="flex items-center gap-2 mb-8">
        {Q.map((q, i) => (
          <div key={q.id} className={`flex-1 h-1.5 rounded-full ${i <= step ? 'bg-sky-500' : 'bg-slate-200'}`} />
        ))}
      </div>
      <div className="text-sm text-sky-600 mb-2">
        第 {step+1}/{Q.length} 步{startPoint ? ` · 从${startPoint}出发` : ''} · 目的地：{pickedCity}
      </div>

      <div className="bg-white rounded-2xl p-8 glow-card slide-in" key={step}>
        <div className="text-5xl mb-4">{cur.icon}</div>
        <h2 className="text-2xl font-bold mb-2">{cur.q}</h2>
        <p className="text-slate-500 mb-6">这将影响AI给你的最终方案</p>

        {cur.type === 'number' && (
          <NumberInput cur={cur} next={next} />
        )}

        {cur.type === 'select' && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {cur.options.map(opt => (
              <button key={opt.value} onClick={() => next(opt.value)}
                className="p-4 text-left rounded-xl border-2 border-slate-200 hover:border-sky-500 hover:bg-sky-50 transition">
                <div className="font-semibold">{opt.label}</div>
              </button>
            ))}
          </div>
        )}
      </div>

      {step > 0 && (
        <button onClick={() => setStep(step-1)} className="mt-4 text-slate-500 hover:text-slate-700">
          ← 上一步
        </button>
      )}
    </div>
  );
}

/* ============ 路线详情+地图 ============ */
function RouteDetail({ city, routeKey, prefs, onConfirm }) {
  const cityData = window.CITY_DATABASE[city];
  const route = cityData.routes[routeKey];
  const mapRef = useRef(null);
  const mapInstance = useRef(null);

  useEffect(() => {
    if (!window.AMap || !mapRef.current) return;
    if (mapInstance.current) { mapInstance.current.destroy(); mapInstance.current = null; }
    const allSpots = [
      ...cityData.attractions.mustSee,
      ...cityData.attractions.secondary,
      ...cityData.attractions.hidden
    ];
    const points = route.spots.map(name => {
      const sp = allSpots.find(s => s.name === name || name.includes(s.name));
      return sp ? { ...sp } : null;
    }).filter(Boolean);

    const map = new window.AMap.Map(mapRef.current, {
      zoom: 11,
      center: cityData.coord,
      mapStyle: 'amap://styles/whitesmoke'
    });
    mapInstance.current = map;

    points.forEach((p, i) => {
      new window.AMap.Marker({
        position: p.coord,
        map,
        label: { content: `<div style="background:#0ea5e9;color:#fff;padding:2px 8px;border-radius:8px;font-size:12px">${i+1}.${p.name}</div>`, direction: 'top' }
      });
    });

    if (points.length >= 2) {
      const path = points.map(p => p.coord);
      new window.AMap.Polyline({ map, path, strokeColor: '#0ea5e9', strokeWeight: 3, strokeStyle: 'dashed' });
    }
    map.setFitView();
  }, [routeKey, city]);

  // 一键导入高德
  const importToAmap = () => {
    const allSpots = [
      ...cityData.attractions.mustSee,
      ...cityData.attractions.secondary,
      ...cityData.attractions.hidden
    ];
    const first = allSpots.find(s => route.spots.includes(s.name));
    const last = [...route.spots].reverse().map(n => allSpots.find(s => s.name === n)).find(Boolean);
    if (!first || !last) return alert('正在准备景点坐标...');

    // 高德路径规划链接（移动端APP和Web均可识别）
    const url = `https://uri.amap.com/navigation?from=${first.coord[0]},${first.coord[1]},${encodeURIComponent(first.name)}&to=${last.coord[0]},${last.coord[1]},${encodeURIComponent(last.name)}&via=${route.spots.slice(1,-1).map(n => {
      const s = allSpots.find(x => x.name === n);
      return s ? `${s.coord[0]},${s.coord[1]},${encodeURIComponent(s.name)}` : '';
    }).filter(Boolean).join(';')}&mode=car&policy=1&src=travelmind&coordinate=gaode&callnative=1`;
    window.open(url, '_blank');
  };

  return (
    <div className="bg-white rounded-2xl p-6 glow-card fade-in">
      <div className="flex items-start justify-between mb-4">
        <div>
          <h2 className="text-2xl font-bold">{route.name}</h2>
          <p className="text-slate-500 mt-1">{route.tagline}</p>
        </div>
        <button onClick={onConfirm} className="px-6 py-2.5 bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-semibold rounded-xl hover:opacity-90">
          确认这条路线 →
        </button>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        {/* 行程概要 */}
        <div className="space-y-3">
          {route.dayPlan.map(d => (
            <div key={d.day} className="border border-slate-200 rounded-xl p-4 hover:border-sky-300 transition">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center font-bold">D{d.day}</div>
                  <div className="font-semibold">{d.theme}</div>
                </div>
                <div className="text-xs text-slate-500">⏱️ 约{d.hours}h</div>
              </div>
              <div className="flex flex-wrap gap-1.5">
                {d.list.map((s, i) => (
                  <span key={i} className="text-xs px-2 py-1 rounded-md bg-slate-100 text-slate-700">{i+1}. {s}</span>
                ))}
              </div>
            </div>
          ))}
        </div>

        {/* 地图 */}
        <div>
          <div ref={mapRef} className="amap-container border border-slate-200" style={{ height: 480 }}></div>
          <button onClick={importToAmap} className="mt-3 w-full py-3 bg-gradient-to-r from-emerald-500 to-cyan-600 text-white font-semibold rounded-xl hover:opacity-90 flex items-center justify-center gap-2">
            <span>🗺️</span>
            <span>一键导入高德地图导航（中国大陆）</span>
          </button>
          <p className="text-xs text-slate-400 mt-2 text-center">非中国大陆景点将自动切换至 Google Maps（第一期暂未开放）</p>
        </div>
      </div>
    </div>
  );
}

/* ============ 出行攻略 ============ */
function TransportGuide({ city, prefs, route }) {
  const trans = window.CITY_DATABASE[city].transport;
  const days = route.days;
  const allSpots = [
    ...window.CITY_DATABASE[city].attractions.mustSee,
    ...window.CITY_DATABASE[city].attractions.secondary,
    ...window.CITY_DATABASE[city].attractions.hidden
  ];

  // 计算景点间间隔（粗略）
  const segments = [];
  for (let i = 1; i < route.spots.length; i++) {
    const a = allSpots.find(s => s.name === route.spots[i-1]);
    const b = allSpots.find(s => s.name === route.spots[i]);
    if (a && b) {
      const dist = Math.sqrt(Math.pow(a.coord[0]-b.coord[0], 2) + Math.pow(a.coord[1]-b.coord[1], 2)) * 111;
      segments.push({ from: a.name, to: b.name, dist: dist.toFixed(1), drive: Math.ceil(dist/40*60), transit: Math.ceil(dist/25*60) });
    }
  }

  // 公共交通预估
  const publicCost = days * (trans.publicTransit.metroDailyCost + trans.publicTransit.taxiAvg * 2);

  // 自驾(带休息区/孩子老人考虑)
  const drivingCost = days * (trans.driving.tollPerDay + trans.driving.fuelPer100km * 1.5 + trans.driving.parking);
  const carRentDaily = 350;

  const hasKids = prefs.companions === 'kids' || prefs.companions === 'both';
  const hasElder = prefs.companions === 'elder' || prefs.companions === 'both';
  const useDriving = prefs.transport === 'rentcar' || prefs.transport === 'owncar';

  return (
    <div className="bg-white rounded-2xl p-6 glow-card mb-6">
      <h2 className="text-2xl font-bold mb-4">🚗 出行攻略</h2>

      {/* 节点间隔 */}
      <div className="mb-6">
        <div className="font-semibold mb-3">📍 节点间距与耗时</div>
        <div className="space-y-2">
          {segments.slice(0, 6).map((s, i) => (
            <div key={i} className="flex items-center gap-3 text-sm">
              <div className="flex-1 flex items-center gap-2">
                <span className="text-slate-400">{i+1}</span>
                <span>{s.from}</span>
                <span className="text-slate-400">→</span>
                <span>{s.to}</span>
              </div>
              <div className="text-xs text-slate-500">📏 {s.dist}km</div>
              <div className="text-xs text-slate-500">🚗 {s.drive}min</div>
              <div className="text-xs text-slate-500">🚇 {s.transit}min</div>
            </div>
          ))}
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {/* 公共交通 */}
        <div className="border border-slate-200 rounded-xl p-5">
          <div className="flex items-center justify-between mb-3">
            <div className="font-bold text-lg">🚇 公共交通</div>
            {prefs.transport === 'public' && <span className="text-xs px-2 py-1 bg-sky-100 text-sky-700 rounded">推荐</span>}
          </div>
          <div className="space-y-2 text-sm">
            <div className="flex justify-between"><span className="text-slate-600">机场往返</span><span>¥150-400</span></div>
            <div className="flex justify-between"><span className="text-slate-600">市内地铁/日</span><span>¥{trans.publicTransit.metroDailyCost}</span></div>
            <div className="flex justify-between"><span className="text-slate-600">出租车/日</span><span>¥{trans.publicTransit.taxiAvg*2}</span></div>
            <div className="flex justify-between"><span className="text-slate-600">公交</span><span>¥{trans.publicTransit.busCost}/次</span></div>
            <div className="flex justify-between font-bold pt-2 border-t border-slate-100"><span>{days}天预估</span><span className="text-sky-600">¥{fmt(publicCost)}</span></div>
          </div>
          {(hasKids || hasElder) && (
            <div className="mt-3 text-xs bg-amber-50 p-2 rounded text-amber-800">
              💡 {hasKids && '小孩'}{hasKids && hasElder && '、'}{hasElder && '老人'}同行建议：避开早晚高峰，多打车少地铁换乘
            </div>
          )}
        </div>

        {/* 自驾 */}
        <div className="border border-slate-200 rounded-xl p-5">
          <div className="flex items-center justify-between mb-3">
            <div className="font-bold text-lg">🚗 {prefs.transport === 'rentcar' ? '租车自驾' : prefs.transport === 'owncar' ? '自驾出行' : '自驾备选'}</div>
            {useDriving && <span className="text-xs px-2 py-1 bg-emerald-100 text-emerald-700 rounded">推荐</span>}
          </div>
          <div className="space-y-2 text-sm">
            {prefs.transport === 'rentcar' && <div className="flex justify-between"><span className="text-slate-600">租车费/日</span><span>¥{carRentDaily}</span></div>}

/* ============ 行程概要专用：区间耗时 / 费用 / 交通工具估算 ============ */
function haversineKm(a, b) {
  if (!a || !b) return 0;
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b[1] - a[1]);
  const dLng = toRad(b[0] - a[0]);
  const lat1 = toRad(a[1]);
  const lat2 = toRad(b[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function calcTransitSegment(km, transportMode) {
  // transportMode: public | rentcar | owncar | mixed
  const isDriving = transportMode === 'rentcar' || transportMode === 'owncar';
  if (isDriving) {
    // 城区平均 30km/h，含红绿灯/拥堵
    const minutes = Math.max(8, Math.round(km / 30 * 60));
    const fuelOrPower = transportMode === 'rentcar'
      ? Math.round(km * 0.65)   // 燃油车
      : Math.round(km * 0.55);  // 私家车含日均折旧
    const tolls = km > 30 ? Math.round(km * 0.45) : 0;
    const parking = km > 0 ? 15 : 0;
    return {
      icon: '🚗',
      mode: transportMode === 'rentcar' ? '租车自驾' : '自驾',
      time: minutes,
      cost: fuelOrPower + tolls + parking,
      detail: `${km.toFixed(1)}km · 油费 ¥${fuelOrPower}` + (tolls ? ` · 过路费 ¥${tolls}` : '') + ` · 停车 ¥${parking}`,
      tip: km / 30 > 3 ? '⚠️ 连续驾驶将超3小时，途中安排休息区' : null
    };
  } else {
    // 公共交通分级
    let icon, mode, cost, speed, detail;
    if (km < 1.5) {
      icon = '🚶'; mode = '步行'; cost = 0; speed = 4;
      detail = `${km.toFixed(1)}km · 步行可达`;
    } else if (km < 8) {
      icon = '🚇'; mode = '地铁'; cost = Math.min(8, 3 + Math.floor(km / 2)); speed = 22;
      detail = `${km.toFixed(1)}km · 地铁约 ${Math.ceil(km / 1.2)} 站 · 票价 ¥${cost}`;
    } else if (km < 25) {
      icon = '🚖'; mode = '出租车/网约车'; cost = Math.round(13 + km * 2.4); speed = 28;
      detail = `${km.toFixed(1)}km · 出租车起步价+里程费 ≈ ¥${cost}`;
    } else if (km < 80) {
      icon = '🚌'; mode = '景区直通巴士/长途车'; cost = Math.round(km * 1.4); speed = 50;
      detail = `${km.toFixed(1)}km · 长途/景区直通车 ≈ ¥${cost}`;
    } else {
      icon = '🚄'; mode = '高铁/动车'; cost = Math.round(km * 0.55); speed = 200;
      detail = `${km.toFixed(1)}km · 高铁二等座 ≈ ¥${cost}`;
    }
    const minutes = Math.max(5, Math.round(km / speed * 60));
    return { icon, mode, time: minutes, cost, detail, tip: null };
  }
}

// 在三档景点中按名字模糊定位
function resolveSpotByName(city, spotName) {
  if (!spotName || !city) return null;
  const a = window.CITY_DATABASE[city]?.attractions;
  if (!a) return null;
  const norm = s => String(s).replace(/[（(].+?[）)]/g, '').replace(/[·\.\s]/g, '');
  const target = norm(spotName);
  for (const tier of ['mustSee', 'secondary', 'hidden']) {
    for (const s of a[tier]) {
      const sn = norm(s.name);
      if (sn === target || sn.includes(target) || target.includes(sn)) return s;
    }
  }
  return null;
}

  // 整体合计

    const items = [];
    let dayDist = 0, dayMin = 0, dayCost = 0, dayTicket = 0;
    day.list.forEach((spotName, idx) => {
      const spot = resolveSpotByName(city, spotName);
      const ticket = spot?.ticket || 0;
      dayTicket += ticket;
      items.push({ kind: 'spot', name: spotName, spot, ticket });
      const nextName = day.list[idx + 1];
      if (nextName) {

        items.push({ kind: 'transit', km, seg });
      }

    totalDist += dayDist; totalTransitMin += dayMin; totalTransitCost += dayCost; totalTicket += dayTicket;
    return { day, items, dayDist, dayMin, dayCost, dayTicket };

            className="px-5 py-2.5 bg-white rounded-lg border border-slate-200 disabled:opacity-30 hover:bg-slate-50">
            ← 上一页

          <div className="flex gap-2">
            {pages.map((_, i) => (
              <button key={i} onClick={() => setPage(i)} className={`w-10 h-10 rounded-lg text-sm font-bold ${i === page ? 'bg-sky-500 text-white' : 'bg-white border border-slate-200 hover:bg-slate-50'}`}>
                {i+1}

            下一页 →

}

/* ============ 省级自驾游：跨城路线方案 ============ */
function ProvinceDrivingPlan({ province, days, startPoint, onRestart }) {
  const pData = window.PROVINCE_DRIVING[province];
  const route = useMemo(() => window.generateDrivingRoute(province, days), [province, days]);
  const [hotelTier, setHotelTier] = useState('mid');
  const tierLabels = { luxury: '高档', mid: '中档', budget: '经济' };

  if (!route) return <div className="text-center py-20 text-slate-400">暂无路线数据</div>;

  // 合计统计
  let totalKm = 0, totalDriveMin = 0;
  route.dayPlan.forEach(d => {
    if (d.drive) { totalKm += d.drive.km; totalDriveMin += d.drive.minutes; }
  });

  // 费用估算（住宿按选定档次计算前N-1晚）
  const fuelCost = Math.round(totalKm * 0.65);
  const tollCost = Math.round(totalKm * 0.4);
  const hotelNights = Math.max(0, days - 1);
  const hotelCost = route.dayPlan.slice(0, hotelNights).reduce((sum, day) => {
    const ci = pData.cities[day.stayCity];
    const h = ci?.hotels?.[hotelTier] || ci?.hotels?.mid;
    return sum + (h ? h.price : 380);
  }, 0);
  const hotelPerNight = hotelNights > 0 ? Math.round(hotelCost / hotelNights) : 380;
  const mealCost = days * 150;
  const ticketCost = days * 100;
  const totalCost = fuelCost + tollCost + hotelCost + mealCost + ticketCost;

  return (
    <div className="max-w-5xl mx-auto py-8 px-6">
      {/* 顶部banner */}
      <div className="no-print bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-2xl p-6 mb-6">
        <div className="flex items-center justify-between flex-wrap gap-4">
          <div>
            <div className="text-sm opacity-80">🚗 省级自驾路线</div>
            <h1 className="text-3xl font-bold mt-1">{route.name}</h1>
            <p className="opacity-90 mt-1">{route.tagline} · {route.cities.length}城 · {totalKm}km{startPoint ? ` · 从${startPoint}出发` : ''}</p>
          </div>
          <button onClick={onRestart} className="px-5 py-2.5 bg-white text-emerald-600 font-bold rounded-xl hover:opacity-90">
            🔄 重新规划
          </button>
        </div>
      </div>

      {/* 酒店档次选择 */}
      <div className="no-print bg-white rounded-2xl p-4 mb-6 glow-card">
        <div className="text-sm text-slate-600 mb-3">🏨 选择住宿档次（{hotelNights}晚住宿费用将据此计算）</div>
        <div className="grid grid-cols-3 gap-3">
          {['luxury', 'mid', 'budget'].map(tier => {
            const isActive = hotelTier === tier;
            const samplePrices = route.dayPlan.slice(0, hotelNights).map(d => {
              const ci = pData.cities[d.stayCity];
              const h = ci?.hotels?.[tier] || ci?.hotels?.mid;
              return h ? h.price : 0;
            });
            const avgPrice = samplePrices.length > 0 ? Math.round(samplePrices.reduce((a,b) => a+b, 0) / samplePrices.length) : 0;
            return (
              <button key={tier} onClick={() => setHotelTier(tier)}
                className={`p-3 rounded-xl text-left transition-all ${isActive ? 'ring-2 ring-emerald-500 bg-emerald-50' : 'bg-slate-50 hover:bg-slate-100'}`}>
                <div className={`font-bold text-sm ${isActive ? 'text-emerald-700' : 'text-slate-700'}`}>
                  {tier === 'luxury' ? '⭐ 高档' : tier === 'mid' ? '🏨 中档' : '💡 经济'}
                </div>
                <div className="text-xs text-slate-500 mt-1">均价 ¥{avgPrice}/晚</div>
                <div className="text-xs text-slate-400 mt-0.5">{tier === 'luxury' ? '四星/五星/精品度假' : tier === 'mid' ? '亚朵/全季/维也纳' : '如家/汉庭/7天'}</div>
              </button>
            );
          })}
        </div>
      </div>

      {/* 打印区域：完整路线 */}
      <div className="print-area bg-white rounded-2xl p-6 glow-card mb-6">
        <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
          <div>
            <div className="text-xs text-emerald-600 mb-1">🗺️ {pData.name}自驾路线图</div>
            <h2 className="text-2xl font-bold">{route.name}</h2>
            <div className="text-xs text-slate-500 mt-1">{route.tagline}</div>
          </div>
          <button onClick={() => window.print()} className="no-print px-4 py-2 text-sm bg-rose-500 text-white rounded-lg hover:bg-rose-600 font-semibold">
            📄 一键打印 / 保存为 PDF
          </button>
        </div>

        {/* 路线城市标签 */}
        <div className="flex flex-wrap gap-1 mb-5">
          {route.cities.map((c, i) => (
            <React.Fragment key={c}>
              {i > 0 && <span className="text-slate-400 mx-1">→</span>}
              <span className="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded text-xs font-medium">{c}</span>
            </React.Fragment>
          ))}
        </div>

        {/* 概要统计 */}
        <div className="grid grid-cols-2 md:grid-cols-5 gap-2 mb-5 text-xs">
          <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400">行程 </span><b>{days} 天</b></div>
          <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400">总路程 </span><b>{totalKm} km</b></div>
          <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400">驾车时间 </span><b>{Math.floor(totalDriveMin/60)}h{totalDriveMin%60}min</b></div>
          <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400">途经城市 </span><b>{route.cities.length} 城</b></div>
          <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400">预估总费 </span><b>¥{fmt(totalCost)}</b></div>
        </div>

        {/* 每日路线 */}
        <div className="space-y-4">
          {route.dayPlan.map((day) => {
            const cityInfo = pData.cities[day.stayCity];
            const driveHours = day.drive ? Math.floor(day.drive.minutes / 60) : 0;
            const driveMinRem = day.drive ? day.drive.minutes % 60 : 0;
            const needRest = day.drive && day.drive.minutes > 180;

            return (
              <div key={day.day} className="print-day border border-slate-200 rounded-xl p-4">
                <div className="flex items-center gap-3 mb-3 flex-wrap">
                  <div className="w-10 h-10 rounded-full bg-gradient-to-br from-emerald-500 to-teal-500 text-white font-bold flex items-center justify-center">D{day.day}</div>
                  <div className="flex-1">
                    <div className="font-bold text-base">第 {day.day} 天 · {day.theme}</div>
                    <div className="text-xs text-slate-500">{day.city}</div>
                  </div>
                  <div className="text-right text-xs text-slate-500">
                    <div>⏱ 全天约{day.hours}h</div>
                  </div>
                </div>

                {/* 驾车段 */}
                {day.drive && day.drive.km > 0 && (
                  <div className="flex items-start gap-3 ml-3 mb-3 pl-4 border-l-2 border-dashed border-emerald-300">
                    <div className="text-lg">🚗</div>
                    <div className="flex-1 text-xs">
                      <span className="font-semibold text-emerald-700">自驾 {day.drive.km}km</span>
                      <span className="text-slate-500"> · {day.drive.route} · ⏱ {driveHours}h{driveMinRem > 0 ? driveMinRem + 'min' : ''}</span>
                      <span className="text-slate-500"> · 油费 ≈ ¥{Math.round(day.drive.km * 0.65)} · 过路费 ≈ ¥{Math.round(day.drive.km * 0.4)}</span>
                      {needRest && <span className="text-rose-500 ml-2">⚠️ 途中需安排服务区休息</span>}
                    </div>
                  </div>
                )}

                {/* 活动/景点 */}
                <div className="space-y-1.5 mb-3">
                  {day.activities.map((act, i) => (
                    <div key={i} className="flex items-center gap-3 py-1">
                      <div className="w-6 h-6 rounded-full bg-amber-100 text-amber-700 font-bold text-xs flex items-center justify-center flex-shrink-0">{i+1}</div>
                      <div className="font-medium text-sm">{act}</div>
                    </div>
                  ))}
                </div>

                {/* 当晚住宿 */}
                {cityInfo && (() => {
                  const selHotel = cityInfo.hotels?.[hotelTier] || cityInfo.hotels?.mid || cityInfo.hotel;
                  const allTiers = cityInfo.hotels || null;
                  return (
                    <div className="ml-3 pl-4 border-l-2 border-dashed border-amber-300">
                      <div className="flex items-center gap-2 text-xs text-amber-700">
                        <span className="text-base">🏨</span>
                        <span>当晚入住 <b>{selHotel.name}</b>（{tierLabels[hotelTier] || '中档'}）· ¥{selHotel.price}/晚</span>
                      </div>
                      {allTiers && (
                        <div className="ml-6 mt-1 flex flex-wrap gap-2 text-[11px]">
                          {['luxury', 'mid', 'budget'].map(t => {
                            const h = allTiers[t];
                            if (!h) return null;
                            const isActive = t === hotelTier;
                            return (
                              <button key={t} onClick={() => setHotelTier(t)}
                                className={`px-2 py-0.5 rounded-full border transition-all ${isActive ? 'bg-amber-100 border-amber-400 text-amber-800 font-semibold' : 'bg-white border-slate-200 text-slate-500 hover:border-amber-300'}`}>
                                {t === 'luxury' ? '⭐' : t === 'mid' ? '🏨' : '💡'} {h.name} ¥{h.price}
                              </button>
                            );
                          })}
                        </div>
                      )}
                      {cityInfo.food && (
                        <div className="text-xs text-slate-500 ml-6 mt-0.5">🍜 推荐美食：{cityInfo.food}</div>
                      )}
                    </div>
                  );
                })()}

                {/* 当日导航按钮 */}
                {day.drive && day.drive.km > 0 && (() => {
                  const fromCity = day.day === 1 ? pData.capital : route.dayPlan[day.day - 2].stayCity;
                  const toCity = day.stayCity;
                  const fromCoord = pData.cities[fromCity]?.coord;
                  const toCoord = pData.cities[toCity]?.coord;
                  if (!fromCoord || !toCoord) return null;
                  const navUrl = `https://uri.amap.com/navigation?from=${fromCoord[0]},${fromCoord[1]},${encodeURIComponent(fromCity)}&to=${toCoord[0]},${toCoord[1]},${encodeURIComponent(toCity)}&mode=car&policy=1&src=travelmind&coordinate=gaode&callnative=1`;
                  return (
                    <div className="mt-2 ml-3">
                      <a href={navUrl} target="_blank" rel="noopener" className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-xs font-medium hover:bg-blue-100 transition">
                        🗺️ 导航今日行程（{day.drive.km}km）
                      </a>
                    </div>
                  );
                })()}
              </div>
            );
          })}
        </div>

        {/* 费用预估 */}
        <div className="mt-6 bg-emerald-50 border border-emerald-200 rounded-xl p-4">
          <h3 className="font-bold text-lg mb-3">💰 自驾费用预估</h3>
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3 text-sm">
            <div className="text-center"><div className="text-slate-500">油费</div><div className="font-bold text-emerald-700">¥{fmt(fuelCost)}</div></div>
            <div className="text-center"><div className="text-slate-500">过路费</div><div className="font-bold text-emerald-700">¥{fmt(tollCost)}</div></div>
            <div className="text-center"><div className="text-slate-500">住宿({days-1}晚)</div><div className="font-bold text-emerald-700">¥{fmt(hotelCost)}</div></div>
            <div className="text-center"><div className="text-slate-500">餐饮</div><div className="font-bold text-emerald-700">¥{fmt(mealCost)}</div></div>
            <div className="text-center"><div className="text-slate-500">门票</div><div className="font-bold text-emerald-700">¥{fmt(ticketCost)}</div></div>
          </div>
          <div className="mt-3 pt-3 border-t border-emerald-200 text-center">
            <span className="text-slate-500">总计预估：</span>
            <span className="text-2xl font-bold text-emerald-700">¥{fmt(totalCost)}</span>
            <span className="text-xs text-slate-400 ml-2">(不含购物/娱乐)</span>
          </div>
        </div>

        <div className="mt-3 text-[11px] text-slate-400 text-center">
          ℹ️ 路程/耗时基于高速公路估算 · 油费按0.65元/km · 过路费按0.4元/km · 实际以高德导航为准
        </div>
      </div>

      {/* 导入高德地图 */}
      <div className="no-print text-center py-6">
        <button onClick={() => {
          const cities = route.cities;
          const origin = pData.cities[cities[0]].coord.join(',');
          const dest = pData.cities[cities[cities.length-1]].coord.join(',');
          const viaCities = cities.slice(1, -1);
          const via = viaCities.map(c => pData.cities[c].coord.join(',') + ',' + encodeURIComponent(c)).join(';');
          let url = `https://uri.amap.com/navigation?from=${origin},${encodeURIComponent(cities[0])}&to=${dest},${encodeURIComponent(cities[cities.length-1])}`;
          if (via) url += `&via=${via}`;
          url += `&mode=car&policy=1&src=travelmind&coordinate=gaode&callnative=1`;
          window.open(url, '_blank');
        }} className="px-8 py-4 bg-gradient-to-r from-blue-500 to-blue-700 text-white font-bold text-lg rounded-2xl hover:opacity-90 mr-3">
          🗺️ 一键导入高德地图导航
        </button>
        <button onClick={onRestart} className="px-8 py-4 bg-white border-2 border-slate-200 text-slate-700 font-bold text-lg rounded-2xl hover:bg-slate-50">
          🔄 重新规划
        </button>
      </div>
    </div>
  );
}

/* ============ 主应用 ============ */
function App() {
  const [stage, setStage] = useState('home'); // home | start-point | collect | recommend | plan | province-days | province-plan
  const [prompt, setPrompt] = useState('');
  const [city, setCity] = useState(null);
  const [prefs, setPrefs] = useState(null);
  const [routeKey, setRouteKey] = useState(null);
  const [startPoint, setStartPoint] = useState(null);
  const [destination, setDestination] = useState(null); // { type: 'city'|'province', city/province }
  // 省级自驾模式
  const [province, setProvince] = useState(null);
  const [drivingDays, setDrivingDays] = useState(null);

  const reset = () => {
    setStage('home');
    setPrompt('');
    setCity(null);
    setPrefs(null);
    setRouteKey(null);
    setStartPoint(null);
    setDestination(null);
    setProvince(null);
    setDrivingDays(null);
  };

  return (
    <>
      <Header onReset={reset} />
      {stage === 'home' && (
        <HomePage onSubmit={(text) => {
          setPrompt(text);
          const dest = extractDestination(text);
          const sp = extractStartingPoint(text);
          if (dest && dest.type === 'province') {
            setProvince(dest.province);
            setDestination({ type: 'province', province: dest.province });
            if (sp) {
              setStartPoint(sp);
              setStage('province-days');
            } else {
              setStage('start-point');
            }
          } else {
            const c = dest ? dest.city : extractCity(text);
            setCity(c);
            setDestination({ type: 'city', city: c });
            if (sp) {
              setStartPoint(sp);
              setStage('collect');
            } else {
              setStage('start-point');
            }
          }
        }} />
      )}
      {stage === 'start-point' && destination && (
        <StartPointInput destination={destination}
          onComplete={(sp) => {
            setStartPoint(sp);
            if (destination.type === 'province') {
              setStage('province-days');
            } else {
              setStage('collect');
            }
          }} />
      )}
      {stage === 'collect' && (
        <InfoCollector city={city} prompt={prompt} startPoint={startPoint}
          onComplete={(c, ans) => { setCity(c); setPrefs({ ...ans, startPoint }); setStage('recommend'); }} />
      )}
      {stage === 'recommend' && (
        <RouteRecommendation city={city} prefs={prefs}
          onSelect={(rk) => { setRouteKey(rk); setStage('plan'); }} />
      )}
      {stage === 'plan' && (
        <FullPlan city={city} prefs={prefs} routeKey={routeKey} startPoint={startPoint} onRestart={reset} />
      )}
      {stage === 'province-days' && province && (
        <ProvinceDaysPicker province={province} startPoint={startPoint} onSelect={(d) => { setDrivingDays(d); setStage('province-plan'); }} />
      )}
      {stage === 'province-plan' && province && drivingDays && (
        <ProvinceDrivingPlan province={province} days={drivingDays} startPoint={startPoint} onRestart={reset} />
      )}

      <footer className="border-t border-slate-200 py-6 mt-12 text-center text-sm text-slate-400">
        <div>TravelMind · AI旅游路线规划设计师 · 第一期：中国大陆景点</div>
        <div className="mt-1 text-xs">数据来源：高德POI · 互联网售票热度 · 近3月搜索趋势</div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
