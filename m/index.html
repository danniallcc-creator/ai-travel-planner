<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

function extractDestination(text) {
  if (!text) return null;
  if (window.PROVINCE_DRIVING) {
    for (const [prov, aliases] of Object.entries(window.PROVINCE_ALIASES || {})) {
      const pattern = new RegExp(aliases.join('|'));
      if (pattern.test(text) && (text.match(/自驾|环线|环游|全省|跨城|多城|省内|周游|穿越|环\S{1,3}游|游遍|走遍|转一圈/) || text.match(/几个城市|多个.*城市|串.*城市/))) {
        return { type: 'province', province: prov };
      }
    }
  }
  const city = extractCity(text);
  if (city) return { type: 'city', city };
  return null;
}

function extractCity(text) {

  if (text.match(/喀纳斯|禾木|可可托海|五彩滩|阿勒泰/)) return '阿勒泰';
  if (text.match(/怪石沟|博尔塔拉|艾比湖|博乐/)) return '博乐';
  if (text.match(/火焰山|葡萄沟|坎儿井|交河故城|吐鲁番/)) return '吐鲁番';
  if (text.match(/那拉提草原|空中草原|巩乃斯|那拉提/)) return '那拉提';
  if (text.match(/军垦博物馆|北湖公园|军垦第一连|石河子/)) return '石河子';
  if (text.match(/贵州|黔|贵阳|甲秀楼|青岩|黔灵山/)) return null;

function extractStartingPoint(text) {
  if (!text) return null;
  const patterns = [
    /从(.+?)(?:出发|去|到)/,
    /(.+?)出发(?:去|到)/,
    /在(.+?)(?:出发|去)/,
    /^从(.+?)去/,
  ];
  for (const p of patterns) {
    const m = text.match(p);
    if (m) {
      const cleaned = m[1].replace(/我|想|打算|计划|准备/g, '').trim();
      if (cleaned) {
        const city = extractCity(cleaned);
        return city || cleaned;
      }
    }
  }
  return null;
}

function aiEnrich(spot) {
  return {
    bestTime: spot.duration > 4 ? '建议早7:30入园避开人流' : '上午或傍晚光线最佳',
    avoidTime: '法定节假日10:00-15:00人流高峰',
    aiTip: `根据近30天3万+游客评价，${spot.name}的核心体验时长约${spot.duration}小时。`
  };
}

const isMainlandChina = (city) => true;

function calcRouteCost(prefs, route, city) {
  const { budget, companions, transport, preference } = prefs;
  const days = route.days;
  const trans = window.CITY_DATABASE[city].transport;
  let ticketCost = 0;
  const allSpots = [
    ...window.CITY_DATABASE[city].attractions.mustSee,
    ...window.CITY_DATABASE[city].attractions.secondary,
    ...window.CITY_DATABASE[city].attractions.hidden
  ];
  route.spots.forEach(name => {
    const sp = allSpots.find(s => s.name === name || name.includes(s.name));
    if (sp) ticketCost += sp.ticket || 0;
  });
  const transportDaily = transport === 'rentcar' ? (350 + trans.driving.tollPerDay + trans.driving.fuelPer100km*1.5 + trans.driving.parking)
                        : transport === 'owncar' ? (trans.driving.tollPerDay + trans.driving.fuelPer100km*1.5 + trans.driving.parking)
                        : trans.publicTransit.metroDailyCost + trans.publicTransit.taxiAvg*2;
  const transportTotal = transportDaily * days;
  const mealMultiplier = companions === 'both' ? 1.4 : (companions === 'kids' || companions === 'elder' ? 1.2 : 1);
  const mealDaily = 200 * mealMultiplier;
  const mealTotal = mealDaily * days;
  const hotelTier = budget < 3000 ? 'budget' : budget < 6000 ? 'mid' : 'luxury';
  const hotelData = window.CITY_DATABASE[city].accommodation[hotelTier][0];
  const hotelTotal = hotelData.price * (days - 1);
  const flightCost = 1200;
  const shopping = Math.max(500, budget * 0.1);
  return {
    flight: flightCost, hotel: hotelTotal, food: mealTotal, transport: transportTotal,
    ticket: ticketCost, shopping,
    total: flightCost + hotelTotal + mealTotal + transportTotal + ticketCost,
    hotelTier, hotelDaily: hotelData.price, days
  };
}

function haversineKm(a, b) {
  if (!a || !b) return 0;
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b[1] - a[1]);
  const dLng = toRad(b[0] - a[0]);
  const lat1 = toRad(a[1]);
  const lat2 = toRad(b[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function calcTransitSegment(km, transportMode) {
  const isDriving = transportMode === 'rentcar' || transportMode === 'owncar';
  if (isDriving) {
    const minutes = Math.max(8, Math.round(km / 30 * 60));
    const fuelOrPower = transportMode === 'rentcar' ? Math.round(km * 0.65) : Math.round(km * 0.55);
    const tolls = km > 30 ? Math.round(km * 0.45) : 0;
    const parking = km > 0 ? 15 : 0;
    return {
      icon: '🚗', mode: transportMode === 'rentcar' ? '租车自驾' : '自驾',
      time: minutes, cost: fuelOrPower + tolls + parking,
      detail: `${km.toFixed(1)}km · 油费 ¥${fuelOrPower}` + (tolls ? ` · 过路费 ¥${tolls}` : '') + ` · 停车 ¥${parking}`,
      tip: km / 30 > 3 ? '⚠️ 连续驾驶将超3小时，途中安排休息区' : null
    };
  } else {
    let icon, mode, cost, speed, detail;
    if (km < 1.5) {
      icon = '🚶'; mode = '步行'; cost = 0; speed = 4;
      detail = `${km.toFixed(1)}km · 步行可达`;
    } else if (km < 8) {
      icon = '🚇'; mode = '地铁'; cost = Math.min(8, 3 + Math.floor(km / 2)); speed = 22;
      detail = `${km.toFixed(1)}km · 地铁约 ${Math.ceil(km / 1.2)} 站 · 票价 ¥${cost}`;
    } else if (km < 25) {
      icon = '🚖'; mode = '出租车/网约车'; cost = Math.round(13 + km * 2.4); speed = 28;
      detail = `${km.toFixed(1)}km · 出租车起步价+里程费 ≈ ¥${cost}`;
    } else if (km < 80) {
      icon = '🚌'; mode = '景区直通巴士/长途车'; cost = Math.round(km * 1.4); speed = 50;
      detail = `${km.toFixed(1)}km · 长途/景区直通车 ≈ ¥${cost}`;
    } else {
      icon = '🚄'; mode = '高铁/动车'; cost = Math.round(km * 0.55); speed = 200;
      detail = `${km.toFixed(1)}km · 高铁二等座 ≈ ¥${cost}`;
    }
    const minutes = Math.max(5, Math.round(km / speed * 60));
    return { icon, mode, time: minutes, cost, detail, tip: null };
  }
}

function resolveSpotByName(city, spotName) {
  if (!spotName || !city) return null;
  const a = window.CITY_DATABASE[city]?.attractions;
  if (!a) return null;
  const norm = s => String(s).replace(/[（(].+?[）)]/g, '').replace(/[·\.\s]/g, '');
  const target = norm(spotName);
  for (const tier of ['mustSee', 'secondary', 'hidden']) {
    for (const s of a[tier]) {
      const sn = norm(s.name);
      if (sn === target || sn.includes(target) || target.includes(sn)) return s;
    }
  }
  return null;
}

function BottomNav({ stage, onNav }) {
  const tabs = [
    { key: 'home', icon: '🏠', label: '首页' },
    { key: 'route', icon: '🗺️', label: '路线' },
    { key: 'spots', icon: '🏔️', label: '景点' },
    { key: 'hotel', icon: '🏨', label: '住宿' },
    { key: 'budget', icon: '💰', label: '预算' }
  ];
  const isActive = (key) => {
    if (key === 'home') return stage === 'home';
    if (key === 'route') return stage === 'plan' || stage === 'recommend';
    if (key === 'spots') return stage === 'plan';
    if (key === 'hotel') return stage === 'plan';
    if (key === 'budget') return stage === 'plan';
    return false;
  };
  return (
    <nav className="no-print fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 nav-bar">
      <div className="flex items-center justify-around">
        {tabs.map(t => (
          <button key={t.key} onClick={() => onNav(t.key)}
            className={`flex flex-col items-center py-2 px-3 min-w-[56px] min-h-[48px] active:scale-95 transition-transform ${isActive(t.key) ? 'text-sky-600' : 'text-slate-400'}`}>
            <span className="text-2xl flex-shrink-0">{t.icon}</span>
            <span className="text-[11px] mt-0.5 font-medium">{t.label}</span>
          </button>
        ))}
      </div>
    </nav>
  );
}

function NumberInput({ cur, next }) {
  const [val, setVal] = useState('');
  const inputRef = useRef(null);
  const MAX = 10000000;
  const sanitize = (raw) => {
    const digits = String(raw).replace(/[^\d]/g, '');
    if (!digits) return '';
    let n = parseInt(digits, 10);
    if (Number.isNaN(n)) return '';
    if (n > MAX) n = MAX;
    return String(n);
  };
  const submit = () => { if (val) next(Number(val)); };
  useEffect(() => { const t = setTimeout(() => inputRef.current?.focus(), 300); return () => clearTimeout(t); }, []);
  return (
    <div className="space-y-3">
      <div className="flex items-center gap-2">
        <input ref={inputRef} type="text" placeholder={cur.placeholder}
          value={val}
          min={cur.min || 0}
          max={cur.max || MAX}
          inputMode="numeric"
          onChange={e => setVal(sanitize(e.target.value))}
          onBlur={e => setVal(sanitize(e.target.value))}
          onKeyDown={e => e.key === 'Enter' && submit()}
          className="flex-1 px-4 py-3.5 border-2 border-slate-200 rounded-xl text-lg focus:border-sky-500 outline-none min-h-[48px]" />
        <span className="text-slate-500 text-sm">{cur.suffix}</span>
      </div>
      <button onClick={submit} disabled={!val}
        className="w-full py-3.5 bg-sky-500 text-white rounded-xl font-semibold active:bg-sky-600 disabled:opacity-30 min-h-[48px] text-base">
        下一步
      </button>
    </div>
  );
}

function InfoCollector({ city, prompt, startPoint, onComplete }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [showCityPicker, setShowCityPicker] = useState(!city);
  const [pickedCity, setPickedCity] = useState(city);
  const Q = window.PREFERENCE_QUESTIONS;
  const cur = Q[step];

  if (showCityPicker) {
    return (
      <div className="px-4 py-6">
        <div className="bg-white rounded-2xl p-5 glow-card">
          <div className="text-sm text-sky-600 mb-2">支持城市</div>
          <h2 className="text-xl font-bold mb-2">请选择想去的城市</h2>
          <p className="text-slate-500 text-sm mb-4">你的输入：{prompt}</p>
          <div className="grid grid-cols-2 gap-2">
            {Object.keys(window.CITY_DATABASE).map(c => (
              <button key={c} onClick={() => { setPickedCity(c); setShowCityPicker(false); }}
                className="p-3 rounded-xl border-2 border-slate-200 active:border-sky-500 active:bg-sky-50 transition text-left min-h-[56px]">
                <div className="font-bold">{c}</div>
                <div className="text-[11px] text-slate-500">{window.CITY_DATABASE[c].bestSeason}</div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  const next = (val) => {
    const newAns = { ...answers, [cur.id]: val };
    setAnswers(newAns);
    if (step + 1 < Q.length) {
      setStep(step + 1);
    } else {
      onComplete(pickedCity, newAns);
    }
  };

  return (
    <div className="px-4 py-6">
      <div className="flex items-center gap-1.5 mb-4">
        {Q.map((q, i) => (
          <div key={q.id} className={`flex-1 h-1.5 rounded-full ${i <= step ? 'bg-sky-500' : 'bg-slate-200'}`} />
        ))}
      </div>
      <div className="text-xs text-sky-600 mb-2">
        第 {step+1}/{Q.length} 步{startPoint ? ` · 从${startPoint}出发` : ''} · {pickedCity}
      </div>
      <div className="bg-white rounded-2xl p-5 glow-card slide-in" key={step}>
        <div className="text-4xl mb-3">{cur.icon}</div>
        <h2 className="text-xl font-bold mb-1">{cur.q}</h2>
        <p className="text-slate-500 text-sm mb-5">这将影响AI给你的最终方案</p>
        {cur.type === 'number' && <NumberInput cur={cur} next={next} />}
        {cur.type === 'select' && (
          <div className="space-y-2">
            {cur.options.map(opt => (
              <button key={opt.value} onClick={() => next(opt.value)}
                className="w-full p-4 text-left rounded-xl border-2 border-slate-200 active:border-sky-500 active:bg-sky-50 transition min-h-[52px]">
                <div className="font-semibold">{opt.label}</div>
              </button>
            ))}
          </div>
        )}
      </div>
      {step > 0 && (
        <button onClick={() => setStep(step-1)} className="mt-3 text-slate-500 text-sm py-2 min-h-[44px]">
          ← 上一步
        </button>
      )}
    </div>
  );
}

function RouteDetail({ city, routeKey, prefs, onConfirm }) {
  const cityData = window.CITY_DATABASE[city];

  const importToAmap = () => {
    const allSpots = [
      ...cityData.attractions.mustSee,
      ...cityData.attractions.secondary,
      ...cityData.attractions.hidden

    const first = allSpots.find(s => route.spots.includes(s.name));
    const last = [...route.spots].reverse().map(n => allSpots.find(s => s.name === n)).find(Boolean);
    if (!first || !last) return alert('正在准备景点坐标...');
    const url = `https://uri.amap.com/navigation?from=${first.coord[0]},${first.coord[1]},${encodeURIComponent(first.name)}&to=${last.coord[0]},${last.coord[1]},${encodeURIComponent(last.name)}&via=${route.spots.slice(1,-1).map(n => {
      const s = allSpots.find(x => x.name === n);

    }).filter(Boolean).join(';')}&mode=car&policy=1&src=travelmind&coordinate=gaode&callnative=1`;

  const viewInAmap = () => {

  return (
    <div className="bg-white rounded-2xl p-4 glow-card fade-in">
      <div className="mb-4">
        <h2 className="text-xl font-bold">{route.name}</h2>
        <p className="text-slate-500 text-sm mt-1">{route.tagline}</p>
      </div>

      <button onClick={onConfirm} className="w-full py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-semibold rounded-xl active:scale-[0.98] transition-transform mb-4 min-h-[48px]">

          <div key={d.day} className="border border-slate-200 rounded-xl p-3">

/* ============ 出行攻略 ============ */
function TransportGuide({ city, prefs, route }) {
  const trans = window.CITY_DATABASE[city].transport;
  const days = route.days;
  const allSpots = [
    ...window.CITY_DATABASE[city].attractions.mustSee,
    ...window.CITY_DATABASE[city].attractions.secondary,
    ...window.CITY_DATABASE[city].attractions.hidden
  ];

  const segments = [];
  for (let i = 1; i < route.spots.length; i++) {
    const a = allSpots.find(s => s.name === route.spots[i-1]);
    const b = allSpots.find(s => s.name === route.spots[i]);
    if (a && b) {
      const dist = Math.sqrt(Math.pow(a.coord[0]-b.coord[0], 2) + Math.pow(a.coord[1]-b.coord[1], 2)) * 111;
      segments.push({ from: a.name, to: b.name, dist: dist.toFixed(1), drive: Math.ceil(dist/40*60), transit: Math.ceil(dist/25*60) });
    }
  }

  const publicCost = days * (trans.publicTransit.metroDailyCost + trans.publicTransit.taxiAvg * 2);
  const drivingCost = days * (trans.driving.tollPerDay + trans.driving.fuelPer100km * 1.5 + trans.driving.parking);
  const carRentDaily = 350;
  const hasKids = prefs.companions === 'kids' || prefs.companions === 'both';
  const hasElder = prefs.companions === 'elder' || prefs.companions === 'both';
  const useDriving = prefs.transport === 'rentcar' || prefs.transport === 'owncar';

  return (
    <div className="bg-white rounded-2xl p-4 glow-card mb-4">
      <h2 className="text-xl font-bold mb-3">出行攻略</h2>

      <div className="mb-4">
        <div className="font-semibold text-sm mb-2">节点间距</div>
        <div className="space-y-1.5">
          {segments.slice(0, 6).map((s, i) => (
            <div key={i} className="flex items-center gap-2 text-sm bg-slate-50 rounded-lg p-2">
              <span className="text-slate-400 text-xs">{i+1}</span>
              <span className="flex-1 truncate text-xs">{s.from} → {s.to}</span>
              <span className="text-[11px] text-slate-500">{s.dist}km</span>
              <span className="text-[11px] text-slate-500">{s.drive}min</span>
            </div>
          ))}
        </div>
      </div>

      <div className="space-y-3">
        <div className="border border-slate-200 rounded-xl p-4">
          <div className="flex items-center justify-between mb-2">
            <div className="font-bold">🚇 公共交通</div>
            {prefs.transport === 'public' && <span className="text-[11px] px-2 py-0.5 bg-sky-100 text-sky-700 rounded">推荐</span>}
          </div>
          <div className="space-y-1.5 text-sm">
            <div className="flex justify-between"><span className="text-slate-600">市内地铁/日</span><span>¥{trans.publicTransit.metroDailyCost}</span></div>
            <div className="flex justify-between"><span className="text-slate-600">出租车/日</span><span>¥{trans.publicTransit.taxiAvg*2}</span></div>
            <div className="flex justify-between font-bold pt-2 border-t border-slate-100"><span>{days}天预估</span><span className="text-sky-600">¥{fmt(publicCost)}</span></div>
          </div>
          {(hasKids || hasElder) && (
            <div className="mt-2 text-xs bg-amber-50 p-2 rounded text-amber-800">
              {hasKids && '小孩'}{hasKids && hasElder && '、'}{hasElder && '老人'}同行建议多打车
            </div>
          )}
        </div>

        <div className="border border-slate-200 rounded-xl p-4">
          <div className="flex items-center justify-between mb-2">
            <div className="font-bold">🚗 {prefs.transport === 'rentcar' ? '租车自驾' : '自驾'}</div>
            {useDriving && <span className="text-[11px] px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded">推荐</span>}

/* ============ 整合行程概要 ============ */
function EnhancedItinerary({ city, route, prefs, hotelTier, printable }) {
  const cityData = window.CITY_DATABASE[city];
  const tier = hotelTier || (prefs.budget < 3000 ? 'budget' : prefs.budget < 6000 ? 'mid' : 'luxury');
  const tierLabel = { luxury: '高档', mid: '中档', budget: '经济型' }[tier];
  const recommendedHotel = cityData.accommodation[tier][0];

  let totalDist = 0, totalTransitMin = 0, totalTransitCost = 0, totalTicket = 0;
  const dayBlocks = route.dayPlan.map(day => {
    const items = [];
    let dayDist = 0, dayMin = 0, dayCost = 0, dayTicket = 0;
    day.list.forEach((spotName, idx) => {
      const spot = resolveSpotByName(city, spotName);
      const ticket = spot?.ticket || 0;
      dayTicket += ticket;
      items.push({ kind: 'spot', name: spotName, spot, ticket });
      const nextName = day.list[idx + 1];
      if (nextName) {
        const nextSpot = resolveSpotByName(city, nextName);
        const km = (spot && nextSpot) ? haversineKm(spot.coord, nextSpot.coord) : 3.5;
        const seg = calcTransitSegment(km, prefs.transport);
        dayDist += km; dayMin += seg.time; dayCost += seg.cost;
        items.push({ kind: 'transit', km, seg });
      }
    });
    totalDist += dayDist; totalTransitMin += dayMin; totalTransitCost += dayCost; totalTicket += dayTicket;
    return { day, items, dayDist, dayMin, dayCost, dayTicket };
  });

  const hotelTotalNights = Math.max(0, route.days - 1);
  const hotelTotalCost = recommendedHotel.price * hotelTotalNights;

  return (
    <div className={`bg-white rounded-2xl ${printable ? 'p-4' : 'p-4 glow-card'} mb-4 print-area`}>
      <div className="mb-3">
        <div className="text-xs text-sky-600 mb-1">行程概要</div>
        <h2 className="text-xl font-bold">{city} · {route.name}</h2>
        <div className="text-xs text-slate-500 mt-1">{route.tagline}</div>
      </div>

      <div className="grid grid-cols-2 gap-1.5 mb-4 text-xs">
        <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400">天数 </span><b>{route.days}天</b></div>
        <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400">同行 </span><b>{COMPANION_LABEL[prefs.companions]}</b></div>
        <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400">出行 </span><b>{TRANSPORT_LABEL[prefs.transport]}</b></div>
        <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400">预算 </span><b>¥{fmt(prefs.budget)}</b></div>
      </div>

      <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4">
        <div className="text-xs text-amber-700 mb-0.5">推荐住宿（{tierLabel}）</div>
        <div className="font-bold text-sm">{recommendedHotel.name}</div>
        <div className="flex items-center justify-between mt-1">
          <div className="text-xs text-slate-600">{recommendedHotel.loc}</div>
          <div className="text-rose-500 font-bold text-sm">¥{fmt(recommendedHotel.price)}/晚</div>
        </div>
        <div className="text-xs text-slate-500">{hotelTotalNights}晚 ≈ ¥{fmt(hotelTotalCost)}</div>
      </div>

      <div className="space-y-3">
        {dayBlocks.map(({ day, items, dayDist, dayMin, dayCost, dayTicket }) => (
          <div key={day.day} className="print-day border border-slate-200 rounded-xl p-3">
            <div className="flex items-center gap-2 mb-2">
              <div className="w-8 h-8 rounded-full bg-gradient-to-br from-sky-500 to-indigo-500 text-white font-bold flex items-center justify-center text-sm flex-shrink-0">D{day.day}</div>
              <div className="flex-1">
                <div className="font-bold text-sm">第{day.day}天 · {day.theme}</div>
                <div className="text-[11px] text-slate-500">{day.hours}h · {dayDist.toFixed(1)}km · ¥{dayCost}</div>
              </div>
            </div>

            <div className="space-y-1">
              {items.map((it, i) => {
                if (it.kind === 'spot') {
                  return (
                    <div key={i} className="flex items-start gap-2 py-1">
                      <div className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 font-bold text-[10px] flex items-center justify-center flex-shrink-0 mt-0.5">{Math.floor(i/2)+1}</div>
                      <div className="flex-1">
                        <div className="font-semibold text-sm">{it.name}</div>
                        {it.spot && (
                          <div className="text-[11px] text-slate-500">
                            {it.spot.duration ? `${it.spot.duration}h · ` : ''}门票 ¥{it.ticket}
                          </div>
                        )}
                      </div>
                    </div>
                  );
                } else {
                  const { seg } = it;
                  return (
                    <div key={i} className="flex items-start gap-2 ml-2 my-0.5 pl-3 border-l-2 border-dashed border-slate-300">
                      <div className="text-sm flex-shrink-0">{seg.icon}</div>
                      <div className="flex-1 text-[11px] text-slate-600">
                        {seg.mode} · {seg.time}min · ¥{seg.cost}
                        {seg.tip && <span className="text-rose-500 ml-1">{seg.tip}</span>}
                      </div>
                    </div>
                  );
                }
              })}
            </div>

            {day.day < route.days && (
              <div className="mt-2 ml-2 pl-3 border-l-2 border-dashed border-amber-300">
                <div className="text-[11px] text-amber-700">
                  🏨 入住 {recommendedHotel.name} · ¥{fmt(recommendedHotel.price)}/晚
                </div>
              </div>
            )}
          </div>
        ))}
      </div>

      <div className="mt-4 grid grid-cols-2 gap-2">
        <div className="bg-sky-50 rounded-lg p-2 text-center"><div className="text-[11px] text-slate-500">总路程</div><div className="font-bold text-sky-700 text-sm">{totalDist.toFixed(1)}km</div></div>
        <div className="bg-emerald-50 rounded-lg p-2 text-center"><div className="text-[11px] text-slate-500">区间耗时</div><div className="font-bold text-emerald-700 text-sm">{Math.floor(totalTransitMin/60)}h{totalTransitMin%60}min</div></div>
        <div className="bg-rose-50 rounded-lg p-2 text-center"><div className="text-[11px] text-slate-500">交通费</div><div className="font-bold text-rose-700 text-sm">¥{fmt(totalTransitCost)}</div></div>
        <div className="bg-amber-50 rounded-lg p-2 text-center"><div className="text-[11px] text-slate-500">门票</div><div className="font-bold text-amber-700 text-sm">¥{fmt(totalTicket)}</div></div>
      </div>
    </div>
  );
}

function ProvinceDrivingPlan({ province, days, startPoint, onRestart }) {
  const pData = window.PROVINCE_DRIVING[province];
  const route = useMemo(() => window.generateDrivingRoute(province, days), [province, days]);
  const [hotelTier, setHotelTier] = useState('mid');
  const [expandedDays, setExpandedDays] = useState({});
  const tierLabels = { luxury: '高档', mid: '中档', budget: '经济' };

  if (!route) return <div className="text-center py-20 text-slate-400">暂无路线数据</div>;

  let totalKm = 0, totalDriveMin = 0;
  route.dayPlan.forEach(d => {
    if (d.drive) { totalKm += d.drive.km; totalDriveMin += d.drive.minutes; }
  });

  const fuelCost = Math.round(totalKm * 0.65);
  const tollCost = Math.round(totalKm * 0.4);
  const hotelNights = Math.max(0, days - 1);
  const hotelCost = route.dayPlan.slice(0, hotelNights).reduce((sum, day) => {
    const ci = pData.cities[day.stayCity];
    const h = ci?.hotels?.[hotelTier] || ci?.hotels?.mid;
    return sum + (h ? h.price : 380);
  }, 0);
  const mealCost = days * 150;
  const ticketCost = days * 100;
  const totalCost = fuelCost + tollCost + hotelCost + mealCost + ticketCost;

  const toggleDay = (day) => {
    setExpandedDays(prev => ({ ...prev, [day]: !prev[day] }));
  };

  // 全程导航
  const fullNavUrl = (() => {
    const cities = route.cities;
    const origin = pData.cities[cities[0]].coord.join(',');
    const dest = pData.cities[cities[cities.length-1]].coord.join(',');
    const viaCities = cities.slice(1, -1);
    const via = viaCities.map(c => pData.cities[c].coord.join(',') + ',' + encodeURIComponent(c)).join(';');
    let url = `https://uri.amap.com/navigation?from=${origin},${encodeURIComponent(cities[0])}&to=${dest},${encodeURIComponent(cities[cities.length-1])}`;
    if (via) url += `&via=${via}`;
    url += `&mode=car&policy=1&src=travelmind&coordinate=gaode&callnative=1`;
    return url;
  })();

  return (
    <div className="px-4 py-4 pb-40">
      {/* 顶部banner */}
      <div className="bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-2xl p-4 mb-4">
        <div className="text-xs opacity-80">省级自驾路线</div>
        <h1 className="text-xl font-bold mt-1">{route.name}</h1>
        <p className="text-sm opacity-90 mt-1">{route.cities.length}城 · {totalKm}km{startPoint ? ` · 从${startPoint}出发` : ''}</p>
      </div>

      {/* 酒店档次 */}
      <div className="bg-white rounded-2xl p-4 mb-4 glow-card">
        <div className="text-sm text-slate-600 mb-2">住宿档次（{hotelNights}晚）</div>
        <div className="grid grid-cols-3 gap-2">
          {['luxury', 'mid', 'budget'].map(tier => {
            const isActive = hotelTier === tier;
            return (
              <button key={tier} onClick={() => setHotelTier(tier)}
                className={`p-2.5 rounded-xl text-center transition min-h-[52px] ${isActive ? 'ring-2 ring-emerald-500 bg-emerald-50' : 'bg-slate-50 active:bg-slate-100'}`}>
                <div className={`font-bold text-xs ${isActive ? 'text-emerald-700' : 'text-slate-700'}`}>
                  {tier === 'luxury' ? '⭐ 高档' : tier === 'mid' ? '🏨 中档' : '💡 经济'}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* 概要 */}
      <div className="grid grid-cols-2 gap-1.5 mb-4 text-xs">
        <div className="bg-white rounded-lg p-2 glow-card"><span className="text-slate-400">行程 </span><b>{days}天</b></div>
        <div className="bg-white rounded-lg p-2 glow-card"><span className="text-slate-400">路程 </span><b>{totalKm}km</b></div>
        <div className="bg-white rounded-lg p-2 glow-card"><span className="text-slate-400">驾车 </span><b>{Math.floor(totalDriveMin/60)}h{totalDriveMin%60}min</b></div>
        <div className="bg-white rounded-lg p-2 glow-card"><span className="text-slate-400">费用 </span><b>¥{fmt(totalCost)}</b></div>
      </div>

      {/* 城市标签 */}
      <div className="flex flex-wrap gap-1 mb-4">
        {route.cities.map((c, i) => (
          <React.Fragment key={c}>
            {i > 0 && <span className="text-slate-400 mx-0.5 text-xs">→</span>}
            <span className="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded text-xs font-medium">{c}</span>
          </React.Fragment>
        ))}
      </div>

      {/* 每日路线（可折叠） */}
      <div className="space-y-2 mb-4">
        {route.dayPlan.map((day) => {
          const cityInfo = pData.cities[day.stayCity];
          const driveHours = day.drive ? Math.floor(day.drive.minutes / 60) : 0;
          const driveMinRem = day.drive ? day.drive.minutes % 60 : 0;
          const needRest = day.drive && day.drive.minutes > 180;
          const isExpanded = expandedDays[day.day] !== false; // 默认展开

          // 当日导航
          let dayNavUrl = null;
          if (day.drive && day.drive.km > 0) {
            const fromCity = day.day === 1 ? pData.capital : route.dayPlan[day.day - 2].stayCity;
            const toCity = day.stayCity;
            const fromCoord = pData.cities[fromCity]?.coord;
            const toCoord = pData.cities[toCity]?.coord;
            if (fromCoord && toCoord) {
              dayNavUrl = `https://uri.amap.com/navigation?from=${fromCoord[0]},${fromCoord[1]},${encodeURIComponent(fromCity)}&to=${toCoord[0]},${toCoord[1]},${encodeURIComponent(toCity)}&mode=car&policy=1&src=travelmind&coordinate=gaode&callnative=1`;
            }
          }

          return (
            <div key={day.day} className="print-day bg-white border border-slate-200 rounded-xl overflow-hidden glow-card">
              <div className="p-3 flex items-center gap-2 active:bg-slate-50" onClick={() => toggleDay(day.day)}>
                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-emerald-500 to-teal-500 text-white font-bold flex items-center justify-center text-sm flex-shrink-0">D{day.day}</div>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm">第{day.day}天 · {day.theme}</div>
                  <div className="text-[11px] text-slate-500">{day.city} · {day.hours}h</div>
                </div>
                <div className="text-slate-400 text-lg">{isExpanded ? '⌃' : '⌄'}</div>
              </div>

              {isExpanded && (
                <div className="px-3 pb-3 fade-in">
                  {day.drive && day.drive.km > 0 && (
                    <div className="flex items-start gap-2 ml-2 mb-2 pl-3 border-l-2 border-dashed border-emerald-300">
                      <span className="text-sm">🚗</span>
                      <div className="flex-1 text-xs">
                        <span className="font-semibold text-emerald-700">{day.drive.km}km</span>
                        <span className="text-slate-500"> · {driveHours}h{driveMinRem > 0 ? driveMinRem + 'min' : ''}</span>
                        <span className="text-slate-500"> · 油费¥{Math.round(day.drive.km * 0.65)} · 过路¥{Math.round(day.drive.km * 0.4)}</span>
                        {needRest && <span className="text-rose-500 block mt-0.5">⚠️ 途中需休息</span>}
                      </div>
                    </div>
                  )}

                  <div className="space-y-1 mb-2">
                    {day.activities.map((act, i) => (
                      <div key={i} className="flex items-center gap-2 py-0.5">
                        <div className="w-5 h-5 rounded-full bg-amber-100 text-amber-700 font-bold text-[10px] flex items-center justify-center flex-shrink-0">{i+1}</div>
                        <div className="text-sm">{act}</div>
                      </div>
                    ))}
                  </div>

                  {cityInfo && (() => {
                    const selHotel = cityInfo.hotels?.[hotelTier] || cityInfo.hotels?.mid || cityInfo.hotel;
                    return (
                      <div className="ml-2 pl-3 border-l-2 border-dashed border-amber-300">
                        <div className="text-[11px] text-amber-700">
                          🏨 {selHotel.name} · ¥{selHotel.price}/晚
                        </div>
                        {cityInfo.food && (
                          <div className="text-[11px] text-slate-500 mt-0.5">🍜 {cityInfo.food}</div>
                        )}
                      </div>
                    );
                  })()}

                  {dayNavUrl && (
                    <a href={dayNavUrl} target="_blank" rel="noopener"
                      className="mt-2 inline-flex items-center gap-1.5 px-3 py-2 bg-blue-50 text-blue-600 rounded-lg text-xs font-medium active:bg-blue-100 min-h-[40px]">
                      🗺️ 导航今日行程（{day.drive.km}km）
                    </a>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* 费用 */}
      <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-4">
        <h3 className="font-bold mb-3">自驾费用预估</h3>
        <div className="grid grid-cols-2 gap-2 text-sm">
          <div className="text-center bg-white rounded-lg p-2"><div className="text-[11px] text-slate-500">油费</div><div className="font-bold text-emerald-700">¥{fmt(fuelCost)}</div></div>
          <div className="text-center bg-white rounded-lg p-2"><div className="text-[11px] text-slate-500">过路费</div><div className="font-bold text-emerald-700">¥{fmt(tollCost)}</div></div>
          <div className="text-center bg-white rounded-lg p-2"><div className="text-[11px] text-slate-500">住宿({days-1}晚)</div><div className="font-bold text-emerald-700">¥{fmt(hotelCost)}</div></div>
          <div className="text-center bg-white rounded-lg p-2"><div className="text-[11px] text-slate-500">餐饮+门票</div><div className="font-bold text-emerald-700">¥{fmt(mealCost + ticketCost)}</div></div>
        </div>
        <div className="mt-3 pt-3 border-t border-emerald-200 text-center">
          <span className="text-sm text-slate-500">总计</span>
          <span className="text-2xl font-bold text-emerald-700 ml-2">¥{fmt(totalCost)}</span>
        </div>
      </div>

      {/* 底部固定导航按钮 */}
      <div className="fixed bottom-20 left-0 right-0 px-4 pb-2 no-print z-40" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 56px)' }}>
        <div className="flex gap-2">
          <a href={fullNavUrl} target="_blank" rel="noopener"
            className="flex-1 py-3 bg-gradient-to-r from-blue-500 to-blue-700 text-white font-bold rounded-xl text-center active:scale-[0.98] transition-transform min-h-[48px] flex items-center justify-center gap-1 text-sm">
            🗺️ 一键导航全程
          </a>
          <button onClick={onRestart}
            className="px-4 py-3 bg-white border-2 border-slate-200 text-slate-700 font-bold rounded-xl active:bg-slate-50 min-h-[48px] text-sm">
            🔄
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============ 主应用 ============ */
function App() {
  const [stage, setStage] = useState('home');
  const [prompt, setPrompt] = useState('');
  const [city, setCity] = useState(null);
  const [prefs, setPrefs] = useState(null);
  const [routeKey, setRouteKey] = useState(null);
  const [startPoint, setStartPoint] = useState(null);
  const [destination, setDestination] = useState(null);
  const [province, setProvince] = useState(null);
  const [drivingDays, setDrivingDays] = useState(null);
  const [scrollSection, setScrollSection] = useState(null);

  useEffect(() => { window.scrollTo(0, 0); }, [stage]);

  const reset = () => {
    setStage('home');
    setPrompt('');
    setCity(null);
    setPrefs(null);
    setRouteKey(null);
    setStartPoint(null);
    setDestination(null);
    setProvince(null);
    setDrivingDays(null);
    setScrollSection(null);
    window.scrollTo(0, 0);
  };

  const handleNav = (key) => {
    if (key === 'home') {
      reset();
    } else if (key === 'route' && stage === 'plan') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (key === 'spots' && stage === 'plan') {
      setScrollSection('spots');
    } else if (key === 'hotel' && stage === 'plan') {
      setScrollSection('hotel');
    } else if (key === 'budget' && stage === 'plan') {
      setScrollSection('budget');
    }
  };

  return (
    <>
      {stage === 'home' && (
        <HomePage onSubmit={(text) => {
          setPrompt(text);
          const dest = extractDestination(text);
          const sp = extractStartingPoint(text);
          if (dest && dest.type === 'province') {
            setProvince(dest.province);
            setDestination({ type: 'province', province: dest.province });
            if (sp) {
              setStartPoint(sp);
              setStage('province-days');
            } else {
              setStage('start-point');
            }
          } else {
            const c = dest ? dest.city : extractCity(text);
            setCity(c);
            setDestination({ type: 'city', city: c });
            if (sp) {
              setStartPoint(sp);
              setStage('collect');
            } else {
              setStage('start-point');
            }
          }
        }} />
      )}
      {stage === 'start-point' && destination && (
        <StartPointInput destination={destination}
          onComplete={(sp) => {
            setStartPoint(sp);
            if (destination.type === 'province') {
              setStage('province-days');
            } else {
              setStage('collect');
            }
          }} />
      )}
      {stage === 'collect' && (
        <InfoCollector city={city} prompt={prompt} startPoint={startPoint}
          onComplete={(c, ans) => { setCity(c); setPrefs({ ...ans, startPoint }); setStage('recommend'); }} />
      )}
      {stage === 'recommend' && (
        <RouteRecommendation city={city} prefs={prefs}
          onSelect={(rk) => { setRouteKey(rk); setStage('plan'); window.scrollTo(0, 0); }} />
      )}
      {stage === 'plan' && (
        <FullPlan city={city} prefs={prefs} routeKey={routeKey} startPoint={startPoint} onRestart={reset} scrollSection={scrollSection} />
      )}
      {stage === 'province-days' && province && (
        <ProvinceDaysPicker province={province} startPoint={startPoint} onSelect={(d) => { setDrivingDays(d); setStage('province-plan'); window.scrollTo(0, 0); }} />
      )}
      {stage === 'province-plan' && province && drivingDays && (
        <ProvinceDrivingPlan province={province} days={drivingDays} startPoint={startPoint} onRestart={reset} />
      )}

      <BottomNav stage={stage} onNav={handleNav} />

      <footer className="border-t border-slate-200 py-4 mt-8 mb-20 text-center text-xs text-slate-400 px-4">
        <div>载堉视界 | TravelMind · AI旅游路线规划</div>
        <div className="mt-1 text-[10px]">数据：高德POI · 互联网售票热度</div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
